name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          GRADLE_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: Android project files nahi mili! Kripya pehle ZIP extract karke saari files upload karein."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Android Project found in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/output_apk/" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoardSaathi-APK
          path: output_apk/*.apk
          
